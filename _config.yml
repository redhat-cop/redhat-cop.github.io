title: Red Hat Communities of Practice
email: cop@redhat.com
description: >-
  We are a community of Red Hatters committed to levelling up our skillsets
  and the skillsets of our partners and customers through open source practices.
baseurl: ""
url: "https://redhat-cop.github.io"
github_username: redhat-cop
header_pages:
  - contrib/index.md
  - cop/index.md
  - ci/index.md
  - repo-map.md

markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-relative-links
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: "page"

# Minima 2.x still uses Sass @import / lighten(); silence until the theme migrates
sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

# Custom exclude replaces Jekyll defaults — keep the usual tooling paths out of _site
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .idea
  - .ruby-version
  - renovate.json
  - README.adoc
  - LICENSE
  - SECURITY.md
  - .pre-commit-config.yaml
